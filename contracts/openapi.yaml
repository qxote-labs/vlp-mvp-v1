          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExceptionCreate'
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
  /lifecycle/deliveries/{id}/exceptions/{eid}/resolve:
    post:
      tags:
      - deliveries
      summary: 지연 해소
      x-cr-ref: API 계약
      x-roles:
      - karmaster
      - admin
      x-status: CR-3.2
      parameters:
      - name: id
        in: path
        required: true
        schema:
