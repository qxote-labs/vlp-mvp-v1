        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
  /lifecycle/access/grants/{id}/reissue:
    post:
      tags:
      - access
      summary: 고객 재승인에 의한 신규 발급
      x-cr-ref: API 계약
      x-roles:
      - customer
      x-status: CR-3.2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
  /lifecycle/deliveries/{id}:
    get:
      tags:
      - deliveries
      summary: 배송 상세 (표시 상태 파생 포함)
      x-cr-ref: API 계약
      x-roles:
      - customer
      - karmaster
      - shop
