components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 서버가 호출자 신원에서 grant와 역할을 판정한다. 클라이언트가 보내는 역할 값은 신뢰하지 않는다.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
      description: 모든 명령 API 필수. 오프라인 큐 재전송 시 같은 키를 재사용한다.
  responses:
    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VLP-AUTH-401
            message: 로그인이 필요합니다
    NotFound:
      description: 없음 또는 권한 없음(구분하지 않는다)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VLP-RES-404
            message: 찾을 수 없습니다
    Conflict:
      description: 상태 충돌 또는 중복
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VLP-STATE-409
            message: 현재 상태에서 할 수 없습니다
    Unprocessable:
      description: 검증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VLP-VAL-422
            message: 입력을 확인해 주세요
    TooMany:
      description: 속도·시도 제한
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VLP-RATE-429
            message: 잠시 후 다시 시도해 주세요
  schemas:
    DisplayState:
      type: string
      enum:
      - READY
      - DISPATCHED
      - IN_TRANSIT
      - CUSTOMIZING
      - DELIVERED
      - CONFIRMED
      - EXCEPTION
      description: 표시 상태 7종. CUSTOMIZING·EXCEPTION은 이벤트에서 파생하며 저장하지 않는다. 열거 값은 추가에 열려 있다.
    StorageState:
      type: string
      enum:
      - PLANNED
      - SHIPPED
      - IN_TRANSIT
      - ARRIVED
      - DELIVERED
      description: 플랫폼 저장 상태. READY=PLANNED, DISPATCHED=SHIPPED, IN_TRANSIT, DELIVERED(도착)=ARRIVED, CONFIRMED=DELIVERED.
    ContractStatus:
      type: string
      enum:
      - PENDING_APPROVAL
      - APPROVED
      - REJECTED
      - EXPIRED
      - CANCELLED
    DestinationType:
      type: string
      enum:
      - DEALERSHIP
      - AFFILIATED_SHOP
      - CUSTOM_ADDRESS
    ReceiptMode:
      type: string
      enum:
      - ON_SITE
      - REMOTE_PROXY
      description: 인도의 인수 방식. 신차케어의 수령 방식과 별개 필드다.
    SourceType:
      type: string
      enum:
      - AUTO
      - MANAGER
      description: GPS는 값 추가로 확장한다.
    ContractCreate:
      type: object
      properties:
        manufacturerContractNo:
          type: string
        vehicleModel:
          type: string
        carmasterPhone:
          type: string
        brand:
          type: string
        trim:
          type: string
        color:
          type: string
        contractDate:
          type: string
          format: date
        carmasterName:
          type: string
        dealershipName:
          type: string
        memo:
          type: string
      required:
      - manufacturerContractNo
      - vehicleModel
      - carmasterPhone
    ContractCreated:
      type: object
      properties:
        contractId:
          type: string
          format: uuid
        serviceContractNo:
          type: string
          pattern: ^SS-\d{6}-\d{4}$
        claimToken:
          type: string
          nullable: true
          description: 조회번호. 카마스터 미가입일 때만, 이 응답에서 1회. 이후 재조회 불가.
        carmasterMatched:
          type: boolean
        grantId:
          type: string
          format: uuid
          nullable: true
          description: "[PROPOSED-ADD] 미가입 카마스터 접근 권한 id. 조회번호를 잃었을 때 고객이 재발급(access.reissue)하는 데 쓴다. 가입 카마스터면 null."
      required:
      - contractId
      - serviceContractNo
      - carmasterMatched
    Contract:
      type: object
      properties:
        grantId:
          type: string
          format: uuid
          nullable: true
          description: "[PROPOSED-ADD] 고객 본인 조회에서만, 조회번호가 아직 쓰이지 않은(대기·만료) 미가입 카마스터 건의 권한 id. 재발급(access.reissue)에 쓴다."
        contractId:
          type: string
          format: uuid
        serviceContractNo:
          type: string
        manufacturerContractNo:
          type: string
        status:
          $ref: '#/components/schemas/ContractStatus'
        vehicleModel:
          type: string
        trim:
          type: string
        color:
          type: string
        contractDate:
          type: string
          format: date
        customerDisplayName:
          type: string
        carmaster:
          type: object
          properties:
            name:
              type: string
            phone:
              type: string
            dealershipName:
              type: string
        destinationType:
          $ref: '#/components/schemas/DestinationType'
        deliveryId:
          type: string
          format: uuid
          nullable: true
        expiresAt:
          type: string
          format: date-time
        masked:
          type: boolean
          description: 승인 전 최소 정보만 반환했는가
      required:
      - contractId
      - status
    ContractPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Contract'
        nextCursor:
          type: string
          nullable: true
      required:
      - items
    GrantPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Grant'
        nextCursor:
          type: string
          nullable: true
      required:
      - items
    TimelinePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEntry'
        nextCursor:
          type: string
          nullable: true
      required:
      - items
    MessagePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        nextCursor:
          type: string
          nullable: true
      required:
      - items
    CollectionStatusPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CollectionStatus'
        nextCursor:
          type: string
          nullable: true
      required:
      - items
    ApproveRequest:
      type: object
      properties:
        destinationType:
          $ref: '#/components/schemas/DestinationType'
        consultationMemo:
          type: string
        partnerName:
          type: string
          description: 협력업체명(내부 전용)
      required:
      - destinationType
    RejectRequest:
      type: object
      properties:
        reasonCode:
          type: string
        note:
          type: string
      required:
      - reasonCode
    ReleaseRequest:
      type: object
      properties:
        deliverySiteId:
          type: string
          format: uuid
        customAddress:
          type: string
        receiptMode:
          $ref: '#/components/schemas/ReceiptMode'
        proxyConsent:
          type: boolean
          description: REMOTE_PROXY 선택 시 대리 인수 위임 동의. true 필수.
      required:
      - receiptMode
    ReleaseOrder:
      type: object
      properties:
        memo:
          type: string
    ClaimRequest:
      type: object
      properties:
        phone:
          type: string
        manufacturerContractNo:
          type: string
        claimToken:
          type: string
        pin:
          type: string
          description: "[PROPOSED-ADD] 확인번호(숫자 N자리, 설정 pinLength). 처음이면 새로 정하는 번호, 이미 정했다면 그 번호."
        pinConfirm:
          type: string
          description: "[PROPOSED-ADD] 처음 정할 때(계정이 없거나 휴면)만 필수: pin과 같은 값."
      required:
      - phone
      - claimToken
      - pin
    LoginRequest:
      type: object
      properties:
        phone:
          type: string
        pin:
          type: string
      required:
      - phone
      - pin
    Session:
      type: object
      properties:
        sessionToken:
          type: string
          nullable: true
          description: 이 응답에서만 평문. 멱등 재전송 응답에는 싣지 않는다.
        expiresAt:
          type: string
          format: date-time
      required:
      - sessionToken
    Notification:
      type: object
      properties:
        notificationId:
          type: string
          format: uuid
        text:
          type: string
        refType:
          type: string
          enum:
          - contract
          - delivery
        refId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        read:
          type: boolean
      required:
      - notificationId
      - text
      - refType
      - refId
      - createdAt
      - read
    NotificationPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        nextCursor:
          type: string
          nullable: true
        unreadCount:
          type: integer
      required:
      - items
      - unreadCount
    Grant:
      type: object
      properties:
        grantId:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PENDING_CLAIM
          - ACTIVE
          - EXPIRED
          - REVOKED
          - REJECTED
        expiresAt:
          type: string
          format: date-time
        sessionToken:
          type: string
          nullable: true
          description: "[PROPOSED-ADD] claim 성공 시 이후 요청에 쓰는 세션 토큰. 이 응답에서만 평문."
      required:
      - grantId
      - status
    Delivery:
      type: object
      properties:
        deliveryId:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        displayState:
          $ref: '#/components/schemas/DisplayState'
        storageState:
          $ref: '#/components/schemas/StorageState'
        destinationType:
          $ref: '#/components/schemas/DestinationType'
        receiptMode:
          $ref: '#/components/schemas/ReceiptMode'
        deliverySite:
          type: object
          properties:
            name:
              type: string
            address:
              type: string
            isHome:
              type: boolean
        deliveryCompany:
          type: object
          properties:
            name:
              type: string
            mainPhone:
              type: string
        steps:
          type: array
          items:
            type: object
            properties:
              state:
                $ref: '#/components/schemas/DisplayState'
              at:
                type: string
                format: date-time
              done:
                type: boolean
        ratingTargets:
          type: array
          description: "[PROPOSED-ADD] 평가 대상 ID. 평가 화면이 targetId를 알 방법이 없어 배송 응답에 담는다."
          items:
            type: object
            properties:
              targetType:
                type: string
                enum:
                - KARMASTER
                - SHOP
                - DELIVERY_COMPANY
              targetId:
                type: string
                format: uuid
              name:
                type: string
      required:
      - deliveryId
      - displayState
    TimelineEntry:
      type: object
      properties:
        entryId:
          type: string
          format: uuid
        type:
          type: string
        text:
          type: string
        sourceType:
          $ref: '#/components/schemas/SourceType'
        observedAt:
          type: string
          format: date-time
        published:
          type: boolean
        exceptionId:
          type: string
          format: uuid
          description: "[PROPOSED-ADD] 지연 발생·해소 항목이 가리키는 지연 ID (해소할 때 필요)."
        augmentationId:
          type: string
          format: uuid
          description: "[PROPOSED-ADD] 보강정보 초안·게시 항목의 보강정보 ID. 카마스터·관리자 응답에만 있고 고객 응답에는 없다."
        audience:
          type: string
          enum:
          - INTERNAL
          - CUSTOMER
          description: "[PROPOSED-ADD] 보강정보 항목의 공개 대상. 카마스터·관리자 응답에만 있다."
      required:
      - entryId
      - type
      - observedAt
    LocationObservation:
      type: object
      properties:
        regionText:
          type: string
        sourceType:
          $ref: '#/components/schemas/SourceType'
        observedAt:
          type: string
          format: date-time
      required:
      - regionText
      - sourceType
      - observedAt
    LocationView:
      type: object
      properties:
        latest:
          $ref: '#/components/schemas/LocationObservation'
        history:
          type: array
          items:
            $ref: '#/components/schemas/LocationObservation'
        collectionStatus:
          type: string
          enum:
          - NOT_STARTED
          - COLLECTING
          - STALE
          - STOPPED
        lastAutoCollectedAt:
          type: string
          format: date-time
        destinationAddress:
          type: string
      required:
      - collectionStatus
    CollectionStatus:
      type: object
      properties:
        deliveryId:
          type: string
          format: uuid
        collectionStatus:
          type: string
        lastAutoCollectedAt:
          type: string
          format: date-time
        staleMinutes:
          type: integer
    AugmentationCreate:
      type: object
      properties:
        kind:
          type: string
          enum:
          - LOCATION
          - NOTE
          - CUSTOMIZING
        text:
          type: string
        audience:
          type: string
          enum:
          - INTERNAL
          - CUSTOMER
          default: INTERNAL
        mediaIds:
          type: array
          items:
            type: string
            format: uuid
      required:
      - kind
    Augmentation:
      type: object
      properties:
        kind:
          type: string
          enum:
          - LOCATION
          - NOTE
          - CUSTOMIZING
        text:
          type: string
        audience:
          type: string
          enum:
          - INTERNAL
          - CUSTOMER
          default: INTERNAL
        mediaIds:
          type: array
          items:
            type: string
            format: uuid
        augmentationId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - DRAFT
          - PUBLISHED
      required:
      - kind
    ExceptionCreate:
      type: object
      properties:
        reasonCode:
          type: string
        note:
          type: string
      required:
      - reasonCode
    Exception:
      type: object
      properties:
        exceptionId:
          type: string
          format: uuid
        reasonCode:
          type: string
        raisedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
      required:
      - exceptionId
      - reasonCode
    MediaCreate:
      type: object
      properties:
        purpose:
          type: string
          enum:
          - INTAKE
          - REQUIRED_SHOT
          - CUSTOMIZING
          - OTHER
        slot:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
        clientCreatedAt:
          type: string
          format: date-time
      required:
      - purpose
      - contentType
    MediaInit:
      type: object
      properties:
        mediaId:
          type: string
          format: uuid
        uploadUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
      required:
      - mediaId
      - uploadUrl
    Media:
      type: object
      properties:
        mediaId:
          type: string
          format: uuid
        purpose:
          type: string
        slot:
          type: string
        status:
          type: string
          enum:
          - PUBLISHED
          - WITHDRAWN
        thumbUrl:
          type: string
        url:
          type: string
    Handover:
      type: object
      properties:
        deliveryId:
          type: string
          format: uuid
        receiverType:
          type: string
          enum:
          - CUSTOMER
          - PROXY_INSTALLER
        managerConfirmedAt:
          type: string
          format: date-time
        customerApprovedAt:
          type: string
          format: date-time
        approvalType:
          type: string
          enum:
          - ON_SITE
          - REMOTE
        requiredShotsDone:
          type: boolean
        inspectionItems:
          type: array
          items:
            type: object
            properties:
              item:
                type: string
              result:
                type: string
                enum:
                - PASS
                - FAIL
                - NA
        mediaIds:
          type: array
          items:
            type: string
            format: uuid
        media:
          type: array
          description: "[PROPOSED-ADD] 인수 사진의 보기 주소. 고객이 사진을 열람(원격 승인 전 필수)하려면 ID만으로는 그릴 수 없다."
          items:
            $ref: '#/components/schemas/Media'
      required:
      - deliveryId
    CustomerApproval:
      type: object
      properties:
        approvalType:
          type: string
          enum:
          - ON_SITE
          - REMOTE
        viewedMediaIds:
          type: array
          items:
            type: string
            format: uuid
        memo:
          type: string
        signature:
          type: string
        overrideReason:
          type: string
      required:
      - approvalType
    ProxyReceipt:
      type: object
      properties:
        mediaIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
        note:
          type: string
      required:
      - mediaIds
    RatingCreate:
      type: object
      properties:
        targetType:
          type: string
          enum:
          - KARMASTER
          - SHOP
          - DELIVERY_COMPANY
        targetId:
          type: string
          format: uuid
        deliveryId:
          type: string
          format: uuid
        aspects:
          type: array
          items:
            type: object
            properties:
              aspect:
                type: string
              score:
                type: integer
                minimum: 1
                maximum: 5
            required:
            - aspect
            - score
        comment:
          type: string
      required:
      - targetType
      - targetId
      - aspects
    Rating:
      type: object
      properties:
        ratingId:
          type: string
          format: uuid
        targetType:
          type: string
        createdAt:
          type: string
          format: date-time
    PointSummary:
      type: object
      properties:
        balance:
          type: integer
        ledger:
          type: array
          items:
            type: object
            properties:
              delta:
                type: integer
              reason:
                type: string
              at:
                type: string
                format: date-time
    MessageCreate:
      type: object
      properties:
        body:
          type: string
          maxLength: 2000
        mediaIds:
          type: array
          items:
            type: string
            format: uuid
      required:
      - body
    Message:
      type: object
      properties:
        messageId:
          type: string
          format: uuid
        senderRole:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        readBy:
          type: array
          items:
            type: string
        masked:
          type: boolean
          description: "[PROPOSED-ADD] 관리자가 열람 사유(CHAT_FULL)를 남기기 전에는 true이고 body는 빈 문자열이다 (BR-12)."
      required:
      - messageId
      - body
      - createdAt
    SensitiveViewCreate:
      type: object
      properties:
        viewType:
          type: string
          enum:
          - CHAT_FULL
          - CONSULT_MEMO_FULL
          - CUSTOMER_PHONE_SHOWN
          - AUDIT_VIEW
        contractId:
          type: string
          format: uuid
        reasonCode:
          type: string
      required:
      - viewType
      - contractId
      - reasonCode
    SensitiveViewRecorded:
      type: object
      properties:
        recorded:
          type: boolean
        merged:
          type: boolean
          description: 합산 시간 안의 기존 기록에 합쳐졌는가
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        traceId:
          type: string
      required:
      - code
      - message
