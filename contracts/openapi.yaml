# VLP Lifecycle API v0.1 (제안). 생성 원본은 요청서 3.2 + DDL 델타. 직접 편집 가능.
openapi: 3.0.3
info:
  title: VLP Lifecycle API (제안)
  version: 0.1.0
  description: 'VLP -> JEFLIX 플랫폼 API 계약 초안. 변경 요청서 3.2·3.3, BR-01~14, DDL 델타 v0.1 기준. 이 파일이 요청/응답 형태의 단일 진실 공급원이며, 실행계획서 4장(API 요약)을 대체한다. 상태:
    제안. JEFLIX 회신 전까지 VLP는 api-facade 목 어댑터로 개발한다. x-status: CR-3.2 = 요청서 표에 있음, PROPOSED-ADD = 요청서에 추가 요청해야 함.'
servers:
- url: https://api.example.invalid/v1
  description: placeholder. 실제 URL은 JEFLIX가 정한다 [미결]
security:
- bearerAuth: []
tags:
- name: contracts
- name: access
- name: deliveries
- name: media
- name: handover
- name: engagement
- name: admin
paths:
  /lifecycle/contracts:
    post:
      tags:
      - contracts
      summary: 계약 등록 (고객)
      x-cr-ref: API 계약
      x-roles:
      - customer
      x-status: CR-3.2
      description: 서비스 계약번호(SS-YYYYMM-NNNN)는 서버가 채번한다. 카마스터 미가입이면 claimToken(조회번호)을 응답에 1회만 반환한다. 이후 어떤 응답·알림에도 평문을 싣지 않는다.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractCreate'
      responses:
        '201':
          description: 등록됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
    get:
      tags:
      - contracts
      summary: 계약 목록 (역할별)
      x-cr-ref: API 계약
      x-roles:
      - customer
      - karmaster
      - shop
      - admin
      x-status: CR-3.2
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ContractStatus'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
  /lifecycle/contracts/{id}:
    get:
      tags:
      - contracts
      summary: 계약 상세 (역할별 마스킹)
      x-cr-ref: API 계약
      x-roles:
      - customer
      - karmaster
      - shop
      - admin
      x-status: CR-3.2
      description: 승인 전 카마스터에게는 차량·접수번호·고객 표시명만 반환한다. 권한 없음과 없음을 구분하지 않는다(404).
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
  /lifecycle/contracts/{id}/approve:
    post:
      tags:
      - contracts
      summary: 계약 승인 (카마스터)
      x-cr-ref: API 계약
      x-roles:
      - karmaster
      x-status: CR-3.2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
  /lifecycle/contracts/{id}/reject:
    post:
      tags:
      - contracts
      summary: 계약 거절 (가입 카마스터, 승인 전)
      x-cr-ref: DM-06 (REJECTED 상태)
      x-roles:
      - karmaster
      x-status: PROPOSED-ADD
      description: 요청서 3.2 표에는 없다. DM-06이 REJECTED 상태를 추가했으므로 API 계약에도 추가를 요청해야 한다.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
  /lifecycle/contracts/{id}/confirm:
    post:
      tags:
      - contracts
      summary: 고객 계약 확인
      x-cr-ref: API 계약
      x-roles:
      - customer
      x-status: CR-3.2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
  /lifecycle/contracts/{id}/release-request:
    post:
      tags:
      - contracts
      summary: 출고 요청 (고객)
      x-cr-ref: API 계약 / BR-05
      x-roles:
      - customer
      x-status: CR-3.2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
  /lifecycle/contracts/{id}/release-order:
    post:
      tags:
      - contracts
      summary: 출고 의뢰 (카마스터) -> 배송 건 PLANNED
      x-cr-ref: API 계약
      x-roles:
      - karmaster
      x-status: CR-3.2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseOrder'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
  /lifecycle/access/claims:
    post:
      tags:
      - access
      summary: 조회번호 claim (미가입 카마스터)
      x-cr-ref: API 계약 / BR-02
      x-roles:
      - karmaster
      x-status: CR-3.2
      description: 전화번호 + (제조사 계약번호) + 조회번호. 속도 제한·시도 횟수 제한. 가입 카마스터는 claim이 필요 없다.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
  /lifecycle/access/login:
    post:
      tags:
      - access
      summary: 확인번호 로그인 (미가입 카마스터)
      x-cr-ref: PROPOSED-ADD
      x-roles:
      - karmaster
      x-status: PROPOSED-ADD
      description: "[PROPOSED-ADD] 처음 claim에서 확인번호를 정한 미가입 카마스터가 조회번호 없이 다시 들어온다. 전화번호 + 확인번호, 시도 제한은 claim과 공유. 마지막 계약 종료 후 유예 기간이 지나 휴면이면 409."
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
  /lifecycle/notifications:
    get:
      tags:
      - notifications
      summary: 내 알림 목록 (앱 안)
      x-cr-ref: PROPOSED-ADD
      x-roles:
      - customer
      - karmaster
      - shop
      - admin
      x-status: PROPOSED-ADD
      description: "[PROPOSED-ADD] 알림은 이벤트 참조 + 일반 문구만 가진다. 조회번호 등 평문 금지."
      parameters:
      - name: unread
        in: query
        schema:
          type: boolean
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
  /lifecycle/notifications/{id}/read:
    post:
      tags:
      - notifications
      summary: 알림 읽음 처리
      x-cr-ref: PROPOSED-ADD
      x-roles:
      - customer
      - karmaster
      - shop
      - admin
      x-status: PROPOSED-ADD
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
  /lifecycle/access/grants:
    get:
      tags:
      - access
      summary: 내 권한 목록
      x-cr-ref: API 계약
      x-roles:
      - karmaster
      x-status: CR-3.2
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantPage'
        '401':
